[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kraken-lcd"
version = "1.2.0"
description = "Live system stats on NZXT Kraken LCD coolers: rotating tiles with animated backgrounds, safe uploads, pump/fan curves"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "liquidctl>=1.13",
    "Pillow>=9",
    "psutil>=5",
]

[project.urls]
Homepage = "https://github.com/relative23/kraken-lcd"
Issues = "https://github.com/relative23/kraken-lcd/issues"
Changelog = "https://github.com/relative23/kraken-lcd/blob/main/CHANGELOG.md"

[project.scripts]
kraken-lcd = "kraken_lcd.cli:main"

[tool.setuptools]
packages = ["kraken_lcd"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["E501"]  # long lines: comments and log messages are wrapped by hand

[tool.ruff.lint.isort]
known-first-party = ["kraken_lcd"]
